spring:
  application:
    name: nalanda-backend-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bel_training_management}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Kolkata

server:
  port: 8080
  servlet:
    context-path: /api

user:
  timezone: Asia/Kolkata

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html

nalanda:
  auth:
    development-mode: true
    jwt-secret: change-this-development-secret-to-a-long-random-value
    access-token-minutes: 30